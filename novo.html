<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thaty ✨ · Produção</title>
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produção">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="novo-192.png">
<link rel="apple-touch-icon" href="novo-apple.png">
<meta name="apple-mobile-web-app-title" content="Thaty ✨">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: app de chão de fábrica para produção sob encomenda — barra fixa (topo no PC, base no celular), painel com saldo da cliente, OPs como fichas com etapas tecido→corte→costura→entrega, extrato financeiro com comprovantes */
:root{
  --bg:#0f0e0d; --surface:#1a1815; --surface2:#221f1b; --ink:#ece4d4; --muted:#9a907c; --line:#2e2a24;
  --accent:#b8904f; --accent-ink:#15120e; --tape:#b8904f; --tape-soft:#2a2319; --pink:#f08bb3;
  --ok:#8fae6b; --ok-soft:#1f2a18; --warn:#d6a74a; --warn-soft:#2e2615; --bad:#e07a5f; --bad-soft:#33201a;
  --font-display:"Playfair Display",Georgia,serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
button,input,select{font:inherit;color:inherit}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:#2f4a8a;color:#fff}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:700}
.brand i{width:10px;height:26px;background:var(--tape);border-radius:2px;display:block}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.72);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--tape);color:#fff;font-weight:600}
.sync{font-size:12px;color:rgba(255,255,255,.72)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 96px;display:flex;flex-direction:column;gap:16px}
@media (max-width:760px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--surface);border-top:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:6;background:#2f4a8a}
  nav.tabs button{flex:1;padding:10px 2px;font-size:12px}
  .sync{margin-left:auto;font-size:11px}
  .brand{font-size:18px;white-space:nowrap}
  .top-in{gap:8px}
  .who{font-size:11px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.tape{background:var(--tape);color:#fff;border-color:var(--tape)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.alert{border-left:4px solid var(--tape)}
.kpi.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.big span,.kpi.big small{color:var(--accent-ink);opacity:.85}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.s0{background:var(--line);color:var(--muted)}
.chip.s1{background:var(--warn-soft);color:var(--warn)}
.chip.s2{background:var(--tape-soft);color:var(--ink)}
.chip.s3{background:var(--ok-soft);color:var(--ok)}
.chip.s4{background:var(--bad-soft);color:var(--bad)}

.oplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.op{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.op:hover{border-color:var(--accent)}
.op .code{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps div{height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.half{background:var(--tape)}
.steplbl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--tape-soft);border-color:transparent}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
tfoot td{font-weight:600;border-bottom:0}

.parte{border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hist div{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.hist div:last-child{border-bottom:0}
.hist .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.cols2{grid-template-columns:1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.note{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.calcbox{background:var(--tape-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}

.billrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.billrow:last-child{border-bottom:0}
.lanc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lanc:last-child{border-bottom:0}
.lanc .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px}
.ic.cob{background:var(--tape-soft);color:var(--ink)} .ic.desp{background:var(--warn-soft);color:var(--warn)} .ic.rec{background:var(--ok-soft);color:var(--ok)}
.lanc .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.val.neg{color:var(--ok)}
.anexo{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.anexo img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

.modal-bg{position:fixed;inset:0;background:rgba(30,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal{background:var(--surface);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px;display:flex;flex-direction:column;gap:14px}
@media (min-width:761px){.modal-bg{align-items:center;padding:16px}.modal{border-radius:16px}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.login{max-width:340px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.login input{font-size:28px;letter-spacing:.4em;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.who{font-size:12px;color:rgba(255,255,255,.85);cursor:pointer;border:0;background:none}
.fab{position:fixed;right:16px;bottom:24px;z-index:8;display:flex;align-items:center;gap:8px;background:var(--tape);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(224,103,154,.35);cursor:pointer}
.fab[hidden]{display:none}
@media (max-width:760px){.fab{bottom:calc(76px + env(safe-area-inset-bottom))}}

/* fluxo */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:4px 0}
.fs{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;font-size:12px;color:var(--muted);min-width:0}
.fs:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 17px);right:calc(-50% + 17px);height:3px;border-radius:2px;background:var(--line)}
.fs.done:not(:last-child)::after{background:var(--accent)}
.fs i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.fs.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fs.now i{border-color:var(--tape);color:var(--tape);background:var(--tape-soft)}
.fs.now,.fs.done{color:var(--ink)}
.fs.now b{color:var(--tape)}
.fs b{font-size:12px;font-weight:600}
.fs small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.next{display:flex;gap:8px;align-items:center;background:var(--tape-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px}
.next b{color:var(--tape)}
.next.ok{background:var(--ok-soft)} .next.ok b{color:var(--ok)}
.hero{background:#2f4a8a;color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero span{font-size:13px;opacity:.85}
.hero b{display:block;font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}
.hero small{display:block;font-size:12px;opacity:.85}
.hero .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px}
.step>i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--line);color:var(--muted)}
.step.done>i{background:var(--accent);color:var(--accent-ink)}
.step.now>i{background:var(--tape);color:#fff}
.step>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.step h2{font-size:20px}
.oft{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
details.mini>summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.mini>summary::before{content:"▸ "} details.mini[open]>summary::before{content:"▾ "}
.conta{display:flex;flex-direction:column}
.conta .h,.conta summary{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.conta .h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:0}
.conta summary{list-style:none;cursor:pointer}
.conta summary b{font-weight:600}
.conta .v{text-align:right;font-variant-numeric:tabular-nums;min-width:92px}
.conta .ab{color:var(--bad);font-weight:700}
.conta .zero{color:var(--ok);font-weight:600}
.conta .tot{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:10px 4px;font-weight:700}
.conta details>div{padding:4px 4px 10px;background:var(--bg);border-radius:0 0 8px 8px}
.conta .pg{grid-column:1/-1;justify-self:end}
.pix{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--tape);background:var(--tape-soft);border-radius:12px;padding:10px 14px}
.pix span{font-size:12px;color:var(--muted);display:block}
.pix b{font-size:16px;word-break:break-all}
.pix small{display:block;font-size:12px;color:var(--muted)}
.notif{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2::after{content:" ▾";font-size:14px;color:var(--muted)}
details.sec:not([open])>summary h2::after{content:" ▸"}
.viewer{max-width:100%;max-height:70vh;border-radius:8px;align-self:center}
@media (prefers-reduced-motion:no-preference){.op,.btn{transition:border-color .15s}}

/* ===== estilo Tecido: escuro + dourado ===== */
header.top{background:#0c0b0a!important;border-bottom:1px solid var(--accent);color:var(--ink)!important}
.brand{font-family:var(--font-display)!important;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-size:19px!important}
.brand i{display:none!important}
.brand em{font-style:normal;color:var(--pink);letter-spacing:1px;text-transform:none}
nav.tabs button{color:var(--muted)!important;letter-spacing:.5px}
nav.tabs button[aria-current="page"]{background:none!important;color:var(--accent)!important;box-shadow:inset 0 -2px 0 var(--accent)}
.sync,.who{color:var(--muted)!important}
@media (max-width:760px){nav.tabs{background:#0c0b0a!important;border-top:1px solid var(--accent)!important}nav.tabs button[aria-current="page"]{box-shadow:none}nav.tabs button{text-transform:uppercase;font-size:11px!important;font-weight:600}}
main{max-width:640px!important;gap:12px!important}
h1{font-family:var(--font-display);font-weight:800;font-size:26px} h2{font-family:var(--font-display);font-weight:700;font-size:19px}
.card,.op,.kpi,.oft{background:linear-gradient(180deg,var(--surface2),var(--surface))!important;border-color:var(--line)!important}
.op .code{color:var(--accent);font-family:var(--font-display)}
.btn{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.pri,.btn.tape{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;letter-spacing:.5px}
.fab{background:var(--accent)!important;color:var(--accent-ink)!important;box-shadow:0 4px 14px rgba(0,0,0,.5)!important}
.hero{background:linear-gradient(180deg,var(--surface2),var(--surface))!important;border:1px solid var(--line);color:var(--ink)!important}
.hero b{font-family:var(--font-display)!important;font-weight:800}
.hero .btn{background:transparent!important;color:var(--accent)!important;border-color:var(--accent)!important}
.pix{border-color:var(--accent)!important;background:var(--tape-soft)!important}
.modal-bg{background:rgba(0,0,0,.7)!important}
.modal{background:var(--surface)!important;border-top:1px solid var(--accent)}
.field input,.field select,.login input{background:var(--bg)!important;border-color:var(--line)!important;color:var(--ink)}
.fs.now i{border-color:var(--accent);color:var(--accent);background:var(--tape-soft)}
.fs.now b,.next b{color:var(--accent)}
.next{background:var(--tape-soft)}
.toast{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font:800 34px/1.1 var(--font-display);letter-spacing:-.3px;color:var(--ink)}
.gold{color:var(--accent)!important}
.exp{margin:0;font-size:14px;color:var(--ink);opacity:.9}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px}
.eq span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.eq b{font-size:15px;font-variant-numeric:tabular-nums}
.eq i{font-style:normal;color:var(--muted);font-size:18px}
.okline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ok)}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln>span:first-child{grid-column:1;grid-row:1}.ln small{grid-column:1;grid-row:2;font-size:12px;color:var(--muted)}
.ln .v{grid-column:2;grid-row:1/span 2;align-self:center;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ln.tot{border-top:1px solid var(--accent);border-bottom:0;font-weight:700}
.ln.tot .v{color:var(--accent);font-size:18px;font-family:var(--font-display)}
.prev{font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.how{counter-reset:h;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.how div{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.how div::before{counter-increment:h;content:counter(h);width:26px;height:26px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.ext{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ext:last-child{border-bottom:0}
.ext .aloc{grid-column:1/-1;margin:6px 0 2px;padding:8px 10px;border-radius:10px;background:rgba(122,170,110,.08);border:1px solid rgba(122,170,110,.25);display:flex;flex-direction:column;gap:3px}
.ext .d{font-size:12px;color:var(--muted)}
.ext .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ext .v.pg{color:var(--ok)}
.ext .sl{grid-column:3;text-align:right;font-size:11px;color:var(--muted)}
.ext .ds{grid-column:2;font-size:12px;color:var(--muted)}
.welcome{font-size:13px;color:var(--muted)} .welcome b{color:var(--pink)}
.kpi.big{background:var(--accent)!important;border-color:var(--accent)!important}
.kpi.big b,.kpi.big span,.kpi.big small{color:var(--accent-ink)!important;opacity:1!important}

<body>
<header class="top"><div class="top-in">
  <div class="brand">Produção <em>Thaty ✨</em></div>
  <nav class="tabs" id="tabs">
    <button data-v="inicio">Início</button>
    <button data-v="producoes">Pedidos</button>
    <button data-v="financeiro">Extrato</button>
    <button data-v="mais">Mais</button>
  </nav>
  <button class="fab" id="fab" title="Lançar serviço" hidden aria-label="Lançar outro serviço ou reembolso"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-2 2-2-2-2 2-2-2-3 2V3a1 1 0 0 1 1-1zm2 5v2h8V7H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"/></svg><span>Serviço</span></button>
  <button class="masb" id="masb" hidden aria-label="Assistente" title="Assistente"></button>
  <span class="sync" id="sync">Conectando…</span><button class="who" id="who" hidden></button>
</div></header>
<main id="main"><div class="empty">Carregando dados da produção…</div></main>

<div id="modal-root"></div>

<script src="config.js"></script>
<script>(function(){try{var u=new URL(location.href),k=u.searchParams.get("k"),b=location.origin+location.pathname.replace(/[^/]*$/,"");var m={name:"Thaty ✨ Produção",short_name:"Thaty ✨",start_url:b+"novo.html"+(k?"?k="+encodeURIComponent(k):""),scope:b,display:"standalone",background_color:"#0f0e0d",theme_color:"#0f0e0d",icons:[{src:b+"novo-192.png",sizes:"192x192",type:"image/png"},{src:b+"novo-512.png",sizes:"512x512",type:"image/png"},{src:b+"novo-maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}]};document.querySelectorAll("link[rel=manifest]").forEach(function(l){l.remove()});var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);}catch(e){}})();</script>
<script>
const DEF_CFG = {extra:2.9, assessoria:1.2, corteUn:0.4, corteLocal:"THÁSSIO", costuraUn:2.8, perda:0, modelagem:95};
const VIEWS = ["inicio","producoes","financeiro","mais"];
const COLS = ["insumos","produtos","ops","lanc","pedidos"];
const API = window.PT_API || "";
const S = {pin:"", user:"", ok:false, insumos:[], produtos:[], ops:[], lanc:[], pedidos:[], cfg:{...DEF_CFG}, loaded:{}, view:"inicio", opId:null, sub:"produtos", orc:{prod:"",qtd:""}, fin:{op:"todas"}, readonly:false};
const CAT_COB = ["Tecido","Corte","Costura","Assessoria","Outro"];
const CAT_DESP = ["Modelagem","Pilotagem","Impressão de risco","Frete motoboy","Carreto","Outro"];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (isFinite(n) ? n : 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmt = (n,d=0) => (isFinite(n) ? n : 0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pn = v => { if (typeof v === "number") return v; let s = String(v ?? "").trim().replace(/[R$\s]/g,""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n*100)/100;
const sum = (a,f) => (a||[]).reduce((t,x) => t + (f ? f(x) : x), 0);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fdate = iso => iso ? iso.split("-").reverse().join("/") : "—";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));

function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

/* ---------- servidor (Apps Script) ---------- */
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function api(action, body={}){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, pin:S.pin, ...body})});
  const j = await r.json();
  if (!j.ok){ if (j.erro === "PIN inválido"){ sair(); } throw new Error(j.erro || "Erro no servidor"); }
  return j;
}
let pendentes = 0;
/* cache local: o app abre na hora com os últimos dados e atualiza em segundo plano */
let cacheT;
function salvarCache(){ clearTimeout(cacheT); cacheT = setTimeout(() => { try { store.set("ptn_cache", JSON.stringify({pedidos:S.pedidos, insumos:S.insumos, produtos:S.produtos, ops:S.ops, lanc:S.lanc, cfg:S.cfg, rev:S.rev})); } catch(e){} }, 400); }
function lerCache(){ try { const c = JSON.parse(store.get("ptn_cache") || "null"); if (!c) return false; COLS.forEach(k => { S[k] = c[k] || []; S.loaded[k] = true; }); S.cfg = {...DEF_CFG, ...(c.cfg||{})}; S.rev = c.rev; return true; } catch(e){ return false; } }
function setSync(t){ const el = $("#sync"); if (el) el.textContent = t; }
const queues = {};
function avisoOp(old, nw){
  const code = "P" + (nw.num || ""), nome = produto(nw.produtoId)?.nome || "";
  const ms = [];
  if (!old){ ms.push(`Novo pedido lançado: ${fmt(pn(nw.qtd))} peças`); }
  else {
    const ko = calc(old), kn = calc(nw);
    if (old.solicitado && !old.aceito && nw.aceito) ms.push("Pedido aceito ✓");
    if (!pn(old.kg) && pn(nw.kg)) ms.push(`Tecido separado (${fmt(pn(nw.kg),0)} kg)`);
    if (kn.cortado > ko.cortado) ms.push(`Cortamos ${fmt(kn.cortado - ko.cortado)} peças (${fmt(kn.cortado)}/${fmt(kn.qtd)})`);
    if (kn.enviado > ko.enviado) ms.push(`Foram para a costura ${fmt(kn.enviado - ko.enviado)} peças`);
    if (kn.costurado > ko.costurado) ms.push(`Chegaram da oficina ${fmt(kn.costurado - ko.costurado)} peças (${fmt(kn.costurado)}/${fmt(kn.qtd)})`);
    if (!old.concluida && nw.concluida) ms.push("Pedido entregue ✓");
  }
  return ms.length ? {titulo: `🧵 ${code} · ${nome}`, corpo: ms.join(" · ")} : null;
}
function write(path, data){
  const [col, id] = path.split("/");
  // aplica na tela na hora
  const key = col === "config" ? null : col;
  let aviso = null;
  if (col === "ops" && data && adm()) { try { aviso = avisoOp(S.ops.find(x => x.id === id), {id, ...data}); } catch(e){} }
  if (key){ const arr = S[key]; const i = arr.findIndex(x => x.id === id); if (data === null){ if (i >= 0) arr.splice(i,1); } else { const o = {id, ...clone(data)}; if (i >= 0) arr[i] = o; else arr.push(o); } }
  else if (data) S.cfg = {...DEF_CFG, ...data};
  pendentes++; setSync("Salvando…"); render(); salvarCache();
  const run = () => api("put", aviso ? {col, id, data, aviso} : {col, id, data}).then(j => { S.rev = j.rev; }).catch(e => { toast("Não foi possível salvar: " + e.message); carregar(); })
    .finally(() => { pendentes--; if (!pendentes) setSync("Sincronizado"); });
  queues[path] = (queues[path] || Promise.resolve()).then(run);
  return queues[path];
}
function normalizeOp(op){
  const fix = l => (l||[]).forEach((e,i) => { if (!e.id) e.id = "x" + i; });
  fix(op.corte?.entregas); (op.costuras||[]).forEach(t => { if (!t.id) t.id = "t" + Math.random().toString(36).slice(2,6); fix(t.entregas); });
  return op;
}
const saveOp = op => { normalizeOp(op); const {id, ...d} = op; const p = write("ops/"+id, d); syncCobrancas(op); return p; };
const saveLanc = l => { const {id, ...d} = l; return write("lanc/"+id, d); };

/* ---------- cálculos ---------- */
const insumo = id => S.insumos.find(i => i.id === id);
const produto = id => S.produtos.find(p => p.id === id);
// item do produto: novo formato {nome, valor, un} (valor pago por "un" unidades) ou antigo {insumoId, qtd}
const itemNorm = it => { if (it.nome !== undefined) return {nome: it.nome, valor: pn(it.valor), un: pn(it.un) || 1};
  const i = insumo(it.insumoId), q = pn(it.qtd) || 1, v = pn(i?.valor);
  return q >= 1 ? {nome: i?.nome || "Removido", valor: +(v * q).toFixed(4), un: 1} : {nome: i?.nome || "Removido", valor: v, un: Math.round(1 / q)}; };
const itemCusto = it => { const n = itemNorm(it); return n.valor / (n.un || 1); };
const itemInfo = it => { const n = itemNorm(it); return {nome: n.nome, tipo: "", un: n.un > 1 ? `${fmt(n.un)} un` : "un", valor: n.valor / (n.un || 1)}; };
const brlPc = v => v > 0 && v < 0.1 ? "R$ " + v.toFixed(3).replace(".", ",") : brl(v);
const custoProduto = p => p ? sum(p.itens, itemCusto) : 0;
const opById = id => S.ops.find(o => o.id === id);
const opCode = op => op ? "P" + op.num : "Geral";

function tecidoNecessario(prod, qtd){
  const consumo = pn(prod?.consumoKg), kgRolo = pn(prod?.kgRolo), preco = pn(prod?.precoKg);
  const kg = qtd * consumo * (1 + pn(S.cfg.perda)/100);
  return {consumo, kg, rolos: kgRolo ? Math.ceil(kg / kgRolo) : 0, kgRolo, preco, valor: kg * preco};
}

/* Financeiro: débitos (cobranças + reembolsos) x pagamentos da Thaty, abatidos do mais antigo para o mais novo */
function finance(){
  const deb = S.lanc.filter(l => l.tipo !== "recebimento").map(l => ({...l, pago:0}))
    .sort((a,b) => (a.data||"").localeCompare(b.data||"") || (a.criadoEm||"").localeCompare(b.criadoEm||""));
  const rec = S.lanc.filter(l => l.tipo === "recebimento").sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const aloc = {};
  const apply = (list, val, rid) => { for (const d of list){ if (val <= 0.0001) break; const f = pn(d.valor) - d.pago; if (f <= 0) continue; const x = Math.min(f, val); d.pago += x; val -= x; if (rid) (aloc[rid] ||= []).push({op: d.opId || "", sec: secaoDe(d), x}); } return val; };
  let sobra = 0, sobraSec = 0; const resto = [];
  rec.filter(r => r.secao).forEach(r => { sobraSec += apply(deb.filter(d => (!r.opId || d.opId === r.opId) && secaoDe(d) === r.secao), pn(r.valor), r.id); });
  rec.filter(r => !r.secao && r.opId).forEach(r => { resto.push({id: r.id, v: apply(deb.filter(d => d.opId === r.opId), pn(r.valor), r.id)}); });
  rec.filter(r => !r.secao && !r.opId).forEach(r => resto.push({id: r.id, v: pn(r.valor)}));
  resto.forEach(o => { sobra += apply(deb, o.v, o.id); });
  const st = d => d.pago >= pn(d.valor) - 0.005 ? "pago" : d.pago > 0 ? "parcial" : "pendente";
  const map = {}; deb.forEach(d => map[d.id] = {pago:d.pago, st:st(d)});
  const totCob = sum(deb.filter(d=>d.tipo==="cobranca"), d=>pn(d.valor));
  const totDesp = sum(deb.filter(d=>d.tipo==="despesa"), d=>pn(d.valor));
  const totRec = sum(rec, r=>pn(r.valor));
  return {map, aloc, totCob, totDesp, totRec, saldo: totCob + totDesp - totRec, credito: Math.max(0, sobra) + sobraSec,
    despAberto: sum(deb.filter(d=>d.tipo==="despesa"), d=>pn(d.valor)-d.pago), aberto: sum(deb, d=>pn(d.valor)-d.pago)};
}
function finOp(opId, F){
  const ls = S.lanc.filter(l => l.opId === opId);
  const deb = ls.filter(l => l.tipo !== "recebimento");
  const cob = sum(deb.filter(l=>l.tipo==="cobranca"), l=>pn(l.valor)), desp = sum(deb.filter(l=>l.tipo==="despesa"), l=>pn(l.valor));
  const pago = sum(deb, l => F.map[l.id]?.pago || 0);
  return {cob, desp, pago, aberto: cob + desp - pago};
}

function calc(op){
  const prod = produto(op.produtoId);
  const qtd = pn(op.qtd);
  const custoTecido = op.retalho ? 0 : pn(op.kg) * pn(op.precoKg);
  const c = op.corte || {};
  const cortado = sum(c.entregas, e => pn(e.qtd));
  const pecasReais = cortado > 0 ? cortado : qtd;
  const porItem = pecasReais ? custoTecido / pecasReais : 0;
  const realUn = porItem + S.cfg.extra;
  const corteUn = pn(c.custoUn);
  const cortePago = sum(c.pagamentos, p => pn(p.valor));
  const partes = (op.costuras || []).map((t,i) => {
    const entregue = sum(t.entregas, e => pn(e.qtd));
    const pago = sum(t.pagamentos, p => pn(p.valor));
    const un = pn(t.custoUn), q = pn(t.qtd);
    return {...t, idx:i, label:"T"+(i+1), q, un, entregue, aEntregar:Math.max(0,q-entregue), total:q*un, pago, aPagar:Math.max(0, entregue*un - pago)};
  });
  const enviado = sum(partes, t => t.q);
  const costurado = sum(partes, t => t.entregue);
  const entregueCliente = costurado;
  const tecidoOk = op.retalho || pn(op.kg) > 0;
  // etapas: tecido, corte, costura (entrega da oficina = entrega para a Thaty), finalizado
  // depois do corte, a meta de costura e entrega passa a ser o que saiu do corte (não o pedido)
  const alvo = pecasReais;
  const corteOk = cortado > 0 && (cortado >= qtd || enviado > 0);
  const etapa = [tecidoOk ? 2 : 0, corteOk ? 2 : cortado ? 1 : 0, costurado >= alvo && alvo ? 2 : enviado ? 1 : 0, op.concluida || (alvo && costurado >= alvo) ? 2 : 0];
  let st = 0, stLabel = "Aguardando tecido";
  if (op.concluida || (alvo && costurado >= alvo)){ st = 3; stLabel = "Entregue"; }
  else if (costurado){ st = 2; stLabel = "Entregando"; }
  else if (enviado){ st = 2; stLabel = "Na costura"; }
  else if (cortado){ st = 1; stLabel = corteOk ? "Cortado" : "No corte"; }
  else if (tecidoOk){ st = 1; stLabel = "Tecido comprado"; }
  return {
    prod, qtd: alvo, pedido: qtd, custoTecido, porItem, realUn, realTotal:realUn*alvo, estUn:custoProduto(prod),

function statsProd(prodId){

  const cst = os.flatMap(o => o.costuras || []).filter(t => pn(t.custoUn) > 0).slice(-1)[0];

  return {st, tot, linhas, rolos, kg, tecido, corte, costura, ass, total: tecido + corte + costura + ass, temBase: !!st.ppr};
}

  return linhas;
}
function lerRomaneio(linhas){
  const cores = []; let dentro = false, data = "", total = 0;
  for (const l of linhas){
    if (!data){ const d = l.match(/(\d{2})\/(\d{2})\/(\d{4})/); if (d) data = `${d[3]}-${d[2]}-${d[1]}`; }
    if (/^cor\b.*pe[çc]as/i.test(l)){ dentro = true; continue; }
    if (/total/i.test(l)){ const t = l.match(/([\d.]+)\s*pe[çc]as/i); if (t) total = +t[1].replace(/\./g, ""); if (dentro) dentro = false; continue; }
    if (dentro){ const m = l.match(/^(.+?)\s+(\d+)\s+([\d.]+)$/); if (m) cores.push({cor: corCanon(m[1]), rolos: +m[2], qtd: +m[3].replace(/\./g, "")}); }
  }
  if (!cores.length) return lerSandel(linhas, data);
  return {cores, data, total: total || sum(cores, c => c.qtd)};
}
// formato Sandel (nosso corte): cores nas colunas
function lerSandel(linhas, data){
  const num = x => +String(x).replace(/\./g, "").replace(",", ".");
  const nums = l => (l.match(/[\d.]+/g) || []).map(num);
  const iT = linhas.findIndex(l => /pe[çc]as por tamanho/i.test(l)); if (iT < 0) return {cores: [], data, total: 0};
  let iH = iT + 1; while (iH < linhas.length && !/total$/i.test(linhas[iH])) iH++;
  const cores = linhas[iH].replace(/\s*total$/i, "").trim().split(/\s+/).map(corCanon);
  const tam = {}; let tot = null, i = iH + 1;
  for (; i < linhas.length; i++){ const l = linhas[i];
    if (/^total de pe[çc]as/i.test(l)){ tot = nums(l); break; }
    const m = l.match(/^(\S+)\s+([\d.\s]+)$/); if (m) tam[m[1]] = nums(m[2]); }
  if (!tot || tot.length < cores.length) return {cores: [], data, total: 0};
  const lr = linhas.find(l => /^rolos\b/i.test(l)); const rol = lr ? nums(lr) : [];
  return {cores: cores.map((c, j) => ({cor: c, rolos: rol[j] || 0, qtd: tot[j], tamanhos: Object.fromEntries(Object.entries(tam).map(([t, v]) => [t, v[j]]))})), data, total: tot[cores.length] || sum(tot.slice(0, cores.length), x => x)};
}

/* Cobranças automáticas: tecido (ao lançar o pedido com kg), corte (a cada entrega do corte),
   assessoria (quando as peças são entregues), costura (a cada entrega da oficina) */
function cobrancasAuto(op){
  const out = []; const qtd = pn(op.qtd);
  if (!op.retalho && pn(op.kg) > 0 && pn(op.precoKg) > 0)
    out.push({ref:"tecido", cat:"Tecido", data:op.data, valor:r2(pn(op.kg)*pn(op.precoKg)), desc:`Tecido ${fmt(pn(op.kg),2)} kg × ${brl(pn(op.precoKg))}`});
  const c = op.corte || {}; const un = pn(c.custoUn);
  let acum = 0, fimCorte = "";
  [...(c.entregas||[])].sort((a,b)=>(a.data||"").localeCompare(b.data||"")).forEach(e => {
    const q = pn(e.qtd); if (q <= 0) return; acum += q; if (!fimCorte && qtd && acum >= qtd) fimCorte = e.data;
    if (un > 0) out.push({ref:"corte:"+e.id, cat:"Corte", data:e.data, valor:r2(q*un), desc:`Corte ${fmt(q)} pç × ${brl(un)} (${c.local||"cortador"})`});
  });
  const ass = pn(S.cfg.assessoria);
  (op.costuras||[]).forEach((t,i) => (t.entregas||[]).forEach(e => {
    const q = pn(e.qtd), u = pn(t.custoUn); if (q <= 0) return;
    if (u > 0) out.push({ref:`costura:${t.id}:${e.id}`, cat:"Costura", data:e.data, valor:r2(q*u), desc:`Costura T${i+1} ${t.local||""} · ${fmt(q)} pç × ${brl(u)}`});
    if (ass > 0) out.push({ref:`assessoria:${t.id}:${e.id}`, cat:"Assessoria", data:e.data, valor:r2(q*ass), desc:`Assessoria ${fmt(q)} pç entregues × ${brl(ass)}`});
  }));
  return out;
}
const autoId = (opId, ref) => "a-" + opId + "-" + ref.replace(/[^A-Za-z0-9_-]/g, "_");
function syncCobrancas(op){
  if (S.readonly || !op) return;

  cobrancasAuto(op).forEach(e => {
    const id = autoId(op.id, e.ref); ids.add(id);

    if (cur && cur.valor === e.valor && cur.data === e.data && cur.desc === e.desc && cur.cat === e.cat) return;

async function tecCompras(silencioso){

  if (!pin){ pin = prompt("Senha (PIN) do app Tecido:"); if (!pin) throw new Error("Sem a senha do app Tecido."); }
  const r = await fetch(TEC_API, {method:"POST", body:JSON.stringify({pin, action:"dados", p:{force:false, ev:""}}), redirect:"follow"});
  const j = await r.json(); if (!j || !j.ok) throw new Error(j?.erro || "Erro no app Tecido");
  try { localStorage.setItem("tec_pin", pin); } catch(e){}
  const d = j.data; const lista = [...(d.vendas||[]), ...((d.inv && d.inv.retiradas)||[])];
  // para o lucro: todas as vendas da Thaty (inclusive as antigas, sem rolos) + retiradas com rolos (as outras espelham uma venda)
  S._tecCompras = [...(d.vendas||[]), ...((d.inv && d.inv.retiradas)||[]).filter(v => (v.rolos||[]).length)].filter(v => /tha|tati|taty/i.test(v.cliente||""));
  return lista.filter(v => /tha|tati|taty/i.test(v.cliente||"") && (v.rolos||[]).length).sort((a,b) => (b.data||"").localeCompare(a.data||""));

const tecLucroPago = (vs, aberto) => sum(vs, v => { const t = (v.tipo === "pronta" ? pn(v.valorReal) : (pn(v.valorReal) || pn(v.estimado))) + pn(v.frete);
  let f = v.pago ? 1 : t > 0 ? Math.min(1, pn(v.recebido) / t) : 0;
  const ref = `${v.aba}|${v.linha}`, op = S.ops.find(o => (o.rolosTec||[]).some(r => r.k.split("|").slice(0,2).join("|") === ref));

function chSave(){ try { localStorage.setItem("pt_chat_" + (S.user||""), JSON.stringify(CH.slice(-40))); } catch(e){} }
const sugAssist = () => ["Pedidos em andamento", "Quanto falta pagar?", "Peças por cor", "Último pagamento", "Custo por peça", "Chave Pix", "Limpar conversa"];
function viewAssist(){ chLoad();
  let h = `<button class="btn sm ghost" onclick="S.view='producoes';render()">‹ Voltar</button><div class="chat">`;
  if (!CH.length) h += `<div class="bav">${mascote()}<div class="msg bot"><h4>Oi! Sou o assistente da produção</h4>Pergunte do seu jeito, por exemplo:<br>• <b>como está a P4</b><br>• <b>quanto falta pagar</b><br>• <b>peças por cor</b><br>• <b>custo por peça da regata</b><br><br>Toque no microfone 🎤 para falar.</div></div>`;
  h += CH.map(m => m.eu ? `<div class="msg eu">${esc(m.t)}</div>` : `<div class="bav">${mascote()}<div class="msg bot">${m.h}</div></div>`).join("") + "</div>";
  h += `<div class="cbar"><div class="sg">${sugAssist().map(t => `<button type="button" onclick="pergAssist('${t}')">${t}</button>`).join("")}</div><form onsubmit="event.preventDefault();const i=document.getElementById('cq');const v=i.value;i.value='';pergAssist(v)"><button type="button" class="mic${OUVINDO?" on":""}" onclick="falar()" aria-label="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><input id="cq" placeholder="Pergunte ou toque no 🎤" autocomplete="off" enterkeyhint="send"><button>Enviar</button></form></div>`;
  return h;
}
function falar(){ const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Este celular não tem reconhecimento de voz no app. Use o microfone do teclado.");
  if (OUVINDO && REC){ REC.stop(); return; }
  REC = new SR(); REC.lang = "pt-BR"; REC.interimResults = false; REC.maxAlternatives = 1;
  REC.onresult = e => { VOZ = true; pergAssist(e.results[0][0].transcript); };
  REC.onerror = e => { OUVINDO = false; render(); if (e.error === "not-allowed") toast("Libere o microfone para o app nas configurações do celular"); else if (e.error !== "no-speech" && e.error !== "aborted") toast("Não ouvi bem, tente de novo"); };
  REC.onend = () => { OUVINDO = false; if (S.view === "assist") render(); };
  try { REC.start(); OUVINDO = true; render(); } catch(e){ toast("Microfone ocupado, tente de novo"); }
}
function diz(h){ try { if (!("speechSynthesis" in window)) return; const d = document.createElement("div"); d.innerHTML = h.replace(/<\/(div|h4)>|<br>/g, ". ");
  const u = new SpeechSynthesisUtterance(d.textContent.replace(/R\$\s?/g, "").replace(/\s+/g, " ").trim()); u.lang = "pt-BR"; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }
function pergAssist(t){ t = String(t||"").trim(); if (!t) return; chLoad();
  if (/^limpar( conversa)?$/i.test(t)){ CH = []; chSave(); render(); return; }
  CH.push({eu:1, t}); let r; try { r = responde(t); } catch(e){ r = "Não consegui montar a resposta."; }
  CH.push({h:r}); chSave(); render(); if (VOZ){ VOZ = false; diz(r); }
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
}
const lnA = (a, b) => `<div class="ln"><span>${a}</span><span style="text-align:right">${b||""}</span></div>`;
function responde(t){
  const q = nrm(t), ops = sortedOps().filter(o => !pendente(o));
  const abertos = ops.filter(o => calc(o).aberta || secsDe(o.id).tot > 0.005);
  const mOp = q.match(/\bp\s?(\d{1,3})\b/), op = mOp ? S.ops.find(o => +o.num === +mOp[1]) : null;
  const prod = S.produtos.find(p => nrm(p.nome).split(/[\s-]+/).some(w => w.length > 3 && q.includes(w)));
  if (/^(oi|ola|opa|bom dia|boa tarde|boa noite)\b/.test(q) && q.length < 18) return "Olá! O que você quer saber? Use os botões aí embaixo ou pergunte do seu jeito.";
  if (/pix|chave/.test(q)) return `<h4>Chave Pix</h4>${lnA("Chave", `<b>${PIX.chave}</b>`)}${lnA("Banco", PIX.banco)}${lnA("Nome", PIX.nome)}`;
  if (op){ const k = calc(op), g = secsDe(op.id), cc = porCorCorte(op);
    let h = `<h4>${opCode(op)} · ${esc(produto(op.produtoId)?.nome || "")}</h4>` + lnA("Situação", `<b>${esc(k.stLabel)}</b>`) + lnA("Pedido", fmt(k.pedido) + " pç");
    if (k.cortado) h += lnA("Saíram do corte", fmt(k.cortado) + " pç");
    if (k.enviado) h += lnA("Na oficina", fmt(k.enviado) + " pç") + lnA("Voltaram da costura", fmt(k.costurado) + " pç");
    Object.keys(cc).forEach(c => h += lnA(esc(c), fmt(cc[c]) + " pç"));
    h += lnA("Falta pagar", `<b>${brl(g.tot)}</b>`) + g.secs.map(x => lnA(`<span class="muted">${x.nome}</span>`, brl(x.ab))).join("");
    return h; }
  if (/falta|devo|deve|pagar|aberto|divid|quanto/.test(q) && !/custo|peca/.test(q)){
    const gs = ops.map(o => ({o, g: secsDe(o.id)})).filter(x => x.g.tot > 0.005), ger = secsDe(""), tot = sum(gs, x => x.g.tot) + ger.tot;
    if (tot < 0.01) return "Tudo pago! ✅";
    return `<h4>Falta pagar ${brl(tot)}</h4>` + gs.map(x => lnA(`<b>${opCode(x.o)}</b> <span class="muted">${x.g.secs.map(s => s.nome).join(", ")}</span>`, brl(x.g.tot))).join("") + (ger.tot > 0.005 ? lnA("Serviços gerais", brl(ger.tot)) : "") + `<div class="small muted" style="margin-top:6px">Pix: ${PIX.chave}</div>`; }
  if (/paguei|pagamento|recebi|recebeu|comprovante/.test(q)){
    const L = S.lanc.filter(l => l.tipo === "recebimento").sort((a,b) => (b.data||"").localeCompare(a.data||"")).slice(0, 5);
    return L.length ? `<h4>Últimos pagamentos</h4>` + L.map(l => lnA(fdate(l.data), `<b>${brl(pn(l.valor))}</b>`)).join("") + lnA("Total pago", brl(S.F.totRec)) : "Nenhum pagamento lançado ainda."; }
  if (/\bcor(es)?\b|preto|marrom|\boff\b|rubi|branco/.test(q)){
    const L = abertos.filter(o => Object.keys(porCorCorte(o)).length);
    if (!L.length) return "Nenhum pedido em andamento com o corte separado por cor ainda.";
    return L.map(o => { const cc = porCorCorte(o), cs = porCorCostura(o), tc = Object.keys(cs).length;
      return `<h4>${opCode(o)} · ${esc(produto(o.produtoId)?.nome || "")}</h4>` + Object.keys(cc).map(c => lnA(esc(c), tc ? `${fmt(cs[c]||0)} de ${fmt(cc[c])} pç` : fmt(cc[c]) + " pç")).join(""); }).join("<br>"); }
  if (/custo|peca|tecido|preco/.test(q)){
    const prods = prod ? [prod] : S.produtos;
    return prods.map(p => { const o = ops.find(x => x.produtoId === p.id); if (!o) return `<h4>${esc(p.nome)}</h4><span class="muted">Ainda sem produção.</span>`;
      const c = custoPeca(o, calc(o)); return `<h4>${esc(p.nome)} · ${brl(c.total)} por peça</h4>` + c.it.map(x => lnA(x.n, brl(x.v))).join(""); }).join("<br>"); }
  if (/pedido|andamento|producao|onde|etapa|status|como esta|situacao|costura|corte|oficina/.test(q) || prod){
    const L = prod ? abertos.filter(o => o.produtoId === prod.id) : abertos;
    return L.length ? `<h4>${L.length} pedido${L.length>1?"s":""} em andamento</h4>` + L.map(o => { const k = calc(o); return lnA(`<b>${opCode(o)}</b> ${esc(produto(o.produtoId)?.nome || "")}`, `<span class="muted">${esc(k.stLabel)}</span>`); }).join("") : "Nenhum pedido em andamento agora."; }
  return "Não entendi essa. Tente <b>pedidos em andamento</b>, <b>quanto falta pagar</b>, <b>peças por cor</b>, <b>custo por peça</b> ou o código de um pedido, como <b>P4</b>.";
}
/* mensagem de cobrança para o WhatsApp: tudo o que está em aberto, por pedido e etapa */
function proxSabado(){ const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7)); return d.toISOString().slice(0,10); }
function msgCobranca(){
  const nomeSec = k => k === "Servicos" ? "Serviços" : (SECOES.find(x => x[0] === k) || [0, k])[1];
  const blocos = []; let tot = 0;
  sortedOps().filter(o => !pendente(o)).reverse().forEach(o => { const g = secsDe(o.id); if (g.tot <= 0.005) return; tot += g.tot;
    blocos.push(`*${opCode(o)} · ${produto(o.produtoId)?.nome || ""}*\n` + g.secs.map(x => `• ${nomeSec(x.key)}: ${brl(x.ab)}`).join("\n")); });
  const ger = S.lanc.filter(l => l.tipo !== "recebimento" && !l.opId).map(l => ({l, ab: pn(l.valor) - (S.F.map[l.id]?.pago || 0)})).filter(x => x.ab > 0.005);
  if (ger.length){ const t = sum(ger, x => x.ab); tot += t; blocos.push(`*Serviços gerais*\n` + ger.map(x => `• ${x.l.desc || "Serviço"}: ${brl(x.ab)}`).join("\n")); }
  const fim = proxSabado(), ini = (() => { const d = new Date(fim + "T12:00:00"); d.setDate(d.getDate() - 6); return d.toISOString().slice(0,10); })(), dm = x => fdate(x).slice(0,5);
  return `Oi, Thaty!\n\n*Fechamento da semana · ${dm(ini)} a ${dm(fim)}*\n\n${blocos.join("\n\n")}\n\n*Total da semana: ${brl(tot)}*\n\n*PIX para pagamento*\nChave: ${PIX.chave}\n${PIX.nome}\n${PIX.banco}`;
}

const locais = () => { const s = new Set([S.cfg.corteLocal]); S.ops.forEach(o => { if (o.corte?.local) s.add(o.corte.local); (o.costuras||[]).forEach(t => t.local && s.add(t.local)); }); return [...s].filter(Boolean); };

function criarOpDireta(produtoId, cores, obsExtra, pend){
  const qtd = sum(cores, c => pn(c.qtd)); const p = produto(produtoId); const tn = tecidoNecessario(p, qtd);
  const num = Math.max(0, ...S.ops.map(o => o.num||0)) + 1; const id = "op" + uid();
  const obs = "Cores: " + cores.map(c => c.rolos ? `${c.cor} ${c.rolos} rolo${c.rolos>1?"s":""}` : `${c.cor} ${fmt(pn(c.qtd))}`).join(" · ") + (obsExtra ? " · " + obsExtra : "");
  const tec = pend ? {kg:"", precoKg:"", rolos:""} : {kg: r2(tn.kg||0) || "", precoKg: tn.preco || "", rolos: tn.rolos || ""};
  saveOp({id, num, produtoId, data: today(), qtd, ...tec, sku:"", retalho:false, obs, cores, solicitado: !!pend, aceito: !pend, por: S.user,
    corte:{local:S.cfg.corteLocal, custoUn:S.cfg.corteUn, entregas:[], pagamentos:[]}, costuras:[], entregasCliente:[], concluida:false, criadoEm:new Date().toISOString()});
  return {id, num};
}
function aceitarOp(op){
  const p = produto(op.produtoId); const tn = tecidoNecessario(p, pn(op.qtd));
  saveOp({...clone(op), aceito:true, aceitoEm:new Date().toISOString(), kg: pn(op.kg) || r2(tn.kg||0) || "", precoKg: pn(op.precoKg) || tn.preco || "", rolos: pn(op.rolos) || tn.rolos || ""});
  toast(`Pedido ${opCode(op)} aceito ✓`);
}
function migrarPedidos(){
  return; // desativado: todos os pedidos antigos já viraram produção
  const velhos = (S.pedidos||[]).filter(p => !p.opId && (p.cores||[]).some(c => pn(c.qtd) > 0));
  if (!velhos.length) return;
  setTimeout(() => velhos.forEach(p => { const {id} = criarOpDireta(p.produtoId, (p.cores||[]).filter(c => pn(c.qtd) > 0), p.obs, true); const {id:_, ...d} = p; write("pedidos/" + p.id, {...d, status:"produzindo", opId:id}); }), 50);
}
function aceitarPedido(p){
  const cores = (p.cores||[]).filter(c => pn(c.qtd) > 0); if (!cores.length) return;
  const {id, num} = criarOpDireta(p.produtoId, cores, p.obs);
  const {id:_, ...d} = p; write("pedidos/" + p.id, {...d, status:"produzindo", opId:id});
  toast(`Pedido aceito: virou a produção P${num} ✓`); go("producoes", id);
}
function opForm(op, pre, after){

  form({title: novo ? (pre ? "Nova produção a partir do pedido" : "Nova produção") : "Editar "+opCode(op), fields:[
    {name:"produtoId",label:"Produto",type:"select",full:true,value:op?.produtoId||pre?.produtoId||S.produtos[0].id,options:S.produtos.map(p=>({v:p.id,t:p.nome}))},
    {name:"data",label:"Data do pedido",type:"date",value:op?.data||today()},
    {name:"qtd",label:"Quantidade de peças",type:"num",value:op?.qtd??pre?.qtd??""},

    {name:"precoKg",label:"Preço do kg (R$)",type:"num",value:op?.precoKg||"",ph:"vazio = preço do produto"},
    {name:"rolos",label:"Quantidade de rolos",type:"num",value:op?.rolos||"",ph:"vazio = usa o cálculo"},
    {name:"sku",label:"SKU (opcional)",value:op?.sku||""},

  ],
  live: v => { const p = produto(v.produtoId); if (v.retalho || !v.qtd) return ""; const tn = tecidoNecessario(p, v.qtd);
    if (!tn.consumo) return `<div class="calcbox">Defina o consumo de tecido deste produto em Cadastros › Produtos para calcular o tecido.</div>`;
    return `<div class="calcbox"><b>Tecido necessário: ${fmt(tn.kg,1)} kg${tn.rolos?` · ${tn.rolos} rolos de ~${fmt(tn.kgRolo,1)} kg`:""}</b><span>${brl(tn.valor)} a ${brl(tn.preco)}/kg · ${fmt(tn.consumo,3)} kg por peça${S.cfg.perda?` + ${fmt(S.cfg.perda)}% de margem`:""}</span></div>`; },
  onSave: v => {
    if (!v.qtd) return "Informe a quantidade de peças.";
    const p = produto(v.produtoId); const tn = tecidoNecessario(p, v.qtd);
    if (!v.retalho){ if (!v.precoKg) v.precoKg = tn.preco; if (!v.kg && novo) v.kg = r2(tn.kg); if (!v.rolos && novo) v.rolos = tn.rolos; }
    if (novo){
      const num = Math.max(0, ...S.ops.map(o => o.num||0)) + 1;
      const id = "op" + uid();
      saveOp({id, num, ...v, corte:{local:S.cfg.corteLocal, custoUn:S.cfg.corteUn, entregas:[], pagamentos:[]}, costuras:[], entregasCliente:[], concluida:false, criadoEm:new Date().toISOString()});
      if (after) after(id);
      go("producoes", id);
    } else { saveOp({...clone(op), ...v}); }
  }});
}

    };
  });

    if (lerCache()) setSync("Atualizando…");
    entrou();
    if (!S.user) api("login").then(j => { S.user = j.nome; store.set("pt_user", j.nome); const w = $("#who"); if (w) w.textContent = S.user + " · trocar"; }).catch(() => {});
  }
  render();
})();
</script>
